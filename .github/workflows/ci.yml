name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q --cov=cra24 --cov-report=term-missing
      - name: CLI smoke test
        run: |
          python -m cra24 --help > /dev/null
          export CRA24_STATE="$RUNNER_TEMP/incidents.json"
          # the fixture SBOM matches KEV, so watch must exit 1
          if python -m cra24 watch --kev tests/fixtures/kev.csv --sbom tests/fixtures/app.cdx.json; then exit 1; fi
          python -m cra24 open --cve CVE-2021-44228 --component pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1 --reachability reachable
          python -m cra24 notify --incident INC-0001
          python -m cra24 tick
          python -m cra24 draft --incident INC-0001 | grep -q "## Reporter contact"
